<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-adsense-account" content="ca-pub-8053045122194729">
  <title>BLOUplanet</title>
  <style>
    @font-face {
      font-family: 'CloudSansCode';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408@1.0/goorm-sans-code.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      /* Colors */
      --primary-50: #eef6ff;
      --primary-100: #b9d6fd;
      --primary-500: #007BFF;
      --primary-600: #005BDD;
      --primary-700: #193694;

      --secondary-50: #e3ffe3;
      --secondary-500: #00d200;
      --secondary-600: #00a100;

      --white: #ffffff;
      --gray-50: #fafafa;
      --gray-100: #f5f5f5;
      --gray-200: #e8e8e8;
      --gray-300: #d6d6d6;
      --gray-400: #a6a6a6;
      --gray-500: #757575;
      --gray-600: #575757;
      --gray-700: #454545;
      --gray-800: #2b2b2b;
      --gray-900: #1c1c1c;

      --success: #00ef38;
      --warning: #ffdd00;
      --error: #df0013;
      --info: #c9c9c9;

      /* Typography */
      --font-primary: 'CloudSansCode', sans-serif;
      --font-mono: 'Google Sans Code', monospace;

      --text-display: 72px;
      --text-h1: 56px;
      --text-h2: 36px;
      --text-h3: 28px;
      --text-h4: 24px;
      --text-h5: 20px;
      --text-h6: 18px;
      --text-body-xl: 20px;
      --text-body-lg: 30px;
      --text-body: 22px;
      --text-body-sm: 16px;
      --text-caption: 12px;

      --font-light: 300;
      --font-regular: 400;
      --font-medium: 500;
      --font-semibold: 600;
      --font-bold: 700;
      --font-extrabold: 800;

      /* Spacing (8px based) */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 64px;
      --space-4xl: 80px;
      --space-5xl: 96px;
      --space-6xl: 128px;

      /* Shadows (Hard Shadow - Neobrutalism) */
      --shadow-xs: 8px 8px 0px rgba(0, 0, 0, 0.2);
      --shadow-sm: 2px 2px 0px rgba(0, 0, 0, 0.2);
      --shadow-md: 4px 4px 0px rgba(0, 0, 0, 0.2);
      --shadow-lg: 10px 10px 0px rgba(0, 0, 0, 0.2);
      --shadow-xl: 20px 20px 0px rgba(0, 0, 0, 0.2);
      --shadow-2xl: 25px 25px 0px rgba(0, 0, 0, 0.2);

      /* Border Radius */
      --radius-sm: 14px;
      --radius-md: 20px;
      --radius-lg: 26px;
      --radius-xl: 30px;
      --radius-full: 9999px;

      /* Layout */
      --container-max-width: 1280px;
      --container-padding: var(--space-xl);

      /* Transitions */
      --duration-fast: 0.15s;
      --duration-normal: 0.3s;
      --duration-slow: 0.5s;
      --easing: ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-primary);
      background-color: var(--white);
      color: var(--gray-800);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: var(--space-3xl) var(--space-xl);
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      margin-bottom: var(--space-sm);
    }

    .avatar {
      width: 200px;
      height: 200px;
      border-radius: var(--radius-full);
      object-fit: cover;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: var(--text-h1);
      font-weight: var(--font-bold);
      color: var(--gray-800);
      line-height: 1.2;
    }

    .profile-description {
      color: var(--gray-500);
      font-size: var(--text-body-lg);
      font-weight: var(--font-medium);
      margin-bottom: var(--space-2xl);
      padding-left: 174px;
    }

    .section-title {
      font-size: var(--text-h5);
      font-weight: var(--font-semibold);
      color: var(--gray-800);
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--gray-200);
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      background-color: var(--primary-500);
      color: var(--white);
      box-shadow: var(--shadow-xs);
      font-size: var(--text-body);
      font-family: var(--font-primary);
      font-weight: var(--font-semibold);
      text-decoration: none;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing);
      border: none;
      gap: var(--space-sm);
    }

    .btn:hover {
      background: var(--primary-600);
      box-shadow: var(--shadow-sm);
      transform: translateY(6px);
    }

    .btn:active {
      background: var(--primary-700);
      transform: translateY(8px);
      box-shadow: 0px 0px 0px rgba(0, 0, 0, 0.2);
    }

    .btn-github { background-color: #24292e; }
    .btn-github:hover { background: #3a3f46; }
    .btn-github:active { background: #1b1f23; }

    .btn-huggingface { background-color: #FFD21E; color: var(--gray-900); }
    .btn-huggingface:hover { background: #e6bc1b; }
    .btn-huggingface:active { background: #cca618; }

    .btn-x { background-color: #000000; }
    .btn-x:hover { background: #2a2a2a; }
    .btn-x:active { background: #000000; }

    .btn-bloupla { background-color: var(--primary-500); }
    .btn-bloupla:hover { background: var(--primary-600); }
    .btn-bloupla:active { background: var(--primary-700); }


    .btn-youtube { background-color: #FF0000; }
    .btn-youtube:hover { background: #cc0000; }
    .btn-youtube:active { background: #990000; }

    .btn-pixai { background-color: #7C3AED; }
    .btn-pixai:hover { background: #6d28d9; }
    .btn-pixai:active { background: #5b21b6; }

    .btn-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      object-fit: contain;
    }

    @media (max-width: 639px) {
      body {
        padding: var(--space-2xl) var(--space-md);
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
        gap: var(--space-md);
      }

      .profile-name {
        font-size: var(--text-h3);
      }

      .profile-description {
        padding-left: 0;
        text-align: center;
      }

      .avatar {
        width: 90px;
        height: 90px;
      }

      .btn {
        font-size: var(--text-body-sm);
        padding: var(--space-sm) var(--space-md);
      }

      .btn-icon {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
